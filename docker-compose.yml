services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audesp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: audesp_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
